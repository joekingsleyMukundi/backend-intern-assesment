syntax = "proto3";

package pb;

import "user.proto";

option go_package = "github.com/joekingsleyMukundi/backend-intern-assesment/auth/pb";

message CreateUserRequest{
    string username = 1;
    string full_namr = 2;
    string email = 3;
    string password = 4;
}

message CreateUserResponse{
    User user = 1;
}