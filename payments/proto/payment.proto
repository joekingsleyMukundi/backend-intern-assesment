syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/joekingsleyMukundi/backend-intern-assesment/payments/pb";

message Payment{
    int64 id = 1;
    string owner = 2;
    string status = 3;
    int64 amount = 4;
    google.protobuf.Timestamp created_at = 5;
}